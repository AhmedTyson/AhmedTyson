name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: "0%"
          plugin_lines: yes
          plugin_achievements: no
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          config_timezone: Africa/Cairo

      - name: Anime Metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: github-metrics-anime.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: tyson05
          plugin_anilist_sections: characters
          plugin_anilist_limit_characters: 22
          config_timezone: Africa/Cairo

      - name: Post-process AniList widget - strip minutes/chapters
        run: |
          python << 'PY'
          import re, pathlib
          p=pathlib.Path('github-metrics-anime.svg')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'<div class="field">\s*<svg[^>]*>.*?</svg>\s*\d+\s+minutes watched\s*</div>', '', t, flags=re.S)
          t=re.sub(r'<div class="field">\s*<svg[^>]*>.*?</svg>\s*\d+\s+chapters read\s*</div>', '', t, flags=re.S)
          p.write_text(t, encoding='utf-8')
          PY
